# ─────────────────────────────────────────────────────────────
# Smart Teacher — Docker Compose
#
# سرویس‌های اصلی: postgres + backend
# سرویس‌های اختیاری (پروفایل optional): redis · minio
#   docker compose --profile optional up
# این پروفایل‌ها پیش‌فرض بالا نمی‌آیند و compose فعلی را نمی‌شکنند.
# ─────────────────────────────────────────────────────────────

networks:
  smart-teacher-net:
    driver: bridge

volumes:
  pgdata:
  # redisdata:   # فقط با --profile optional
  # miniodata:   # فقط با --profile optional

services:

  postgres:
    image: postgres:17-alpine
    container_name: smart-teacher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_teacher
      POSTGRES_USER: smart_teacher
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      # کالیشن مناسب برای متن فارسی
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_teacher -d smart_teacher"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart-teacher-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-teacher-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/smart_teacher
      DB_USERNAME: smart_teacher
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - smart-teacher-net

  # ─── اختیاری: Redis (کش / rate-limit توزیع‌شده — فاز ۱۲ بعدی) ───
  # stub: هنوز به backend وصل نیست؛ فقط برای آماده‌سازی محیط
  redis:
    profiles: ["optional"]
    image: redis:7-alpine
    container_name: smart-teacher-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # volumes:
    #   - redisdata:/data
    networks:
      - smart-teacher-net
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # ─── اختیاری: MinIO (ذخیره‌سازی شیء — جایگزین LocalFileStorage) ───
  # stub: هنوز به backend وصل نیست
  minio:
    profiles: ["optional"]
    image: minio/minio:latest
    container_name: smart-teacher-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    # volumes:
    #   - miniodata:/data
    networks:
      - smart-teacher-net
    command: ["server", "/data", "--console-address", ":9001"]
