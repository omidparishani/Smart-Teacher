# ─────────────────────────────────────────────────────────────
# Smart Teacher — Production Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # فشرده‌سازی Gzip برای کاهش حجم ترافیک
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # هدرهای امنیتی پایه سراسری
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream services
    upstream backend_api {
        server backend:8080;
    }

    upstream miniapp_service {
        server miniapp:80;
    }

    upstream admin_panel_service {
        server admin-panel:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;

        # ۱. مسیر بک‌اند API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # مسیر مستندات Swagger / Actuator
        location /swagger-ui/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v3/api-docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        location /actuator/health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # ۲. پنل ادمین (محافظت‌شده در برابر Frame injection / Clickjacking)
        location /admin/ {
            proxy_pass http://admin_panel_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # پنل ادمین هرگز نباید در iframe باز شود
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none';" always;
        }

        # ۳. برنامک معلمان (MiniApp) — داخل WebView / iframe ایتا باز می‌شود
        # 🔴 تله حیاتی: X-Frame-Options: DENY برنامک را در ایتا سفید می‌کند!
        # مبدأهای رسمی ایتا به عنوان frame-ancestors مجاز اعلام می‌شوند:
        location / {
            proxy_pass http://miniapp_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # مجاز ساختن iframe برای کلاینت‌های وب ایتا
            add_header Content-Security-Policy "frame-ancestors 'self' https://eitaa.com https://web.eitaa.com https://*.eitaa.com;" always;
        }
    }
}
